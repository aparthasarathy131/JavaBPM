<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h1 class="sidebar-title">Chat History</h1>
        <button id="new-chat" class="new-chat" type="button">New Chat</button>
      </div>
      <nav id="history" class="history" aria-label="Chat History"></nav>
    </aside>

    <main class="main">
      <header class="main-head">
        <h2 id="conversation-title" class="conversation-title">New conversation</h2>
      </header>
      <section id="messages" class="messages" aria-live="polite"></section>
      <form id="composer" class="composer">
        <textarea id="input" class="input" rows="1" placeholder="Type a message..." aria-label="Message"></textarea>
        <button class="send" type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
